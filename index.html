<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>連接方塊・立體題庫</title><meta name="description" content="四孔連接方塊的平面與立體拼搭題庫，可旋轉模型、逐顆查看及列印題卡。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232660dc'/%3E%3Cpath d='M7 7h7v7H7zm11 0h7v7h-7zM7 18h7v7H7zm11 0h7v7h-7z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="guide.css"></head><body>
<header><div class="logo">▦ <strong>連接方塊</strong><span>立體題庫</span></div><button id="print">列印完成圖題卡</button></header>
<main><aside class="library"><p class="eyebrow">LOOK · CONNECT · CREATE</p><h1>照著拼，<br>把想像接起來。</h1><p>適用照片中的四孔連接方塊。</p><label>題目類型<select id="category"><option value="all">全部 30 題</option><option value="平面">平面排列 · 15 題</option><option value="立體">立體搭建 · 15 題</option></select></label><div id="cards"></div><details><summary>認識這款材料</summary><img src="assets/toy.png" alt="有四格方孔的彩色連接方塊"><p>模型重現四孔外觀；接頭方向請以實物為準，轉動單顆方塊後再扣合，不需硬壓。</p></details></aside>
<section class="work"><div class="workhead"><div><p id="meta" class="eyebrow"></p><h2 id="title"></h2></div><span id="count" class="count"></span></div>
<div id="stage"><canvas id="canvas" aria-label="可拖曳旋轉的連接方塊完成模型"></canvas><span class="hint">拖曳旋轉 · 滾輪縮放</span><div id="fallback" hidden>此瀏覽器無法顯示 3D，請使用支援 WebGL 的瀏覽器。</div></div>
<div class="views"><button data-view="iso">立體視角</button><button data-view="front">正面</button><button data-view="top">俯視</button><button id="reset">重設</button><label><input type="checkbox" id="free">顏色自由搭配</label></div>
<div class="progress"><div><strong>逐顆組裝</strong><span id="progressText"></span></div><input type="range" id="step" min="1" value="1" aria-label="顯示的方塊數量"><div class="stepnav"><button id="prev">上一顆</button><button id="next">下一顆</button><button id="complete">看完成品</button></div></div>
<div class="instructions"><article><h3>這一題怎麼拼</h3><p id="description"></p><ol id="steps"></ol></article><article><h3>材料清單</h3><div id="inventory"></div><h3>老師可以這樣帶</h3><p id="teaching"></p></article></div><p class="note">每一格代表 1 顆相同大小的方塊。先確認位置，再將相鄰的面扣合；平面造型可平放在桌面完成。</p>
</section></main><section id="printcard"><h1 id="printTitle"></h1><img id="printImage" alt="本題 3D 完成圖"><div id="printBody"></div></section><footer>愛迪樂｜鍾孟修 職能治療師 · 連接方塊題庫</footer><script type="module" src="app.js"></script></body></html>
